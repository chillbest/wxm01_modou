<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔豆解析与审核</title><style>body{background:#111827;color:#e5e7eb;font:17px/1.7 system-ui;margin:0}main{max-width:900px;margin:60px auto;padding:24px}button,input{font:inherit;padding:10px}button{background:#253343;color:#fff;border:1px solid #64748b;border-radius:5px;cursor:pointer}a{color:#7dd3fc}li{margin:12px 0;display:flex;align-items:baseline;gap:8px 20px;flex-wrap:wrap}li a{overflow-wrap:anywhere}.batch-timing,.program-version{font-weight:400;color:#94a3b8;white-space:nowrap;font-size:14px}h1{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 16px}#status{white-space:pre-wrap}.batch-item{padding:10px 12px;border-left:3px solid #38bdf8;background:#152236;border-radius:4px}.batch-older{border-left-color:#64748b;background:#171e2b}.batch-older a{color:#a7b4c8}.batch-unknown{border-left-color:#a78bfa}.batch-age{font-size:12px;color:#94a3b8;border:1px solid #475569;border-radius:4px;padding:0 5px}.batch-error{flex-basis:100%;color:#fca5a5;font-size:14px}</style><main><h1>魔豆解析与审核 <span class="program-version">v{{program_modified_at}}</span></h1><p>选择TXT文件，每解析10条即可在线审核并确认入库。</p><form id="upload"><input id="file" type="file" accept=".txt" required><button id="parse">解析</button></form><form id="url-upload"><input id="note-url" type="url" placeholder="公开笔记URL" required><button id="parse-url">解析URL</button></form><p id="status" role="status"></p><h2>审核批次</h2><ul id="batches"></ul></main><script src="/assets/home.js"></script></html>
